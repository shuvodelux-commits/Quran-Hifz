name: Settings Interaction CI

on:
  push:
    branches:
      - feat/settings-interaction-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Settings widget tests
        run: flutter test --fail-fast test/features/settings/presentation/settings_page_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Diff check
        run: git diff --check origin/main...HEAD
