name: Playback Word Meaning CI

on:
  push:
    branches:
      - feat/playback-word-meaning-bubble

permissions:
  contents: read

jobs:
  playback-meaning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Targeted tests
        run: |
          flutter test --fail-fast test/features/quran/presentation/quran_reader_page_test.dart
          flutter test --fail-fast test/features/settings/presentation/settings_page_test.dart
          flutter test --fail-fast test/features/settings/application/app_preferences_controller_test.dart
          flutter test --fail-fast test/features/settings/data/user_database_app_preferences_repository_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Full test suite
        run: flutter test --fail-fast
