name: Playback Word Meaning CI

on:
  push:
    branches:
      - feat/playback-word-meaning-bubble

permissions:
  contents: read

jobs:
  playback-meaning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Targeted tests
        run: |
          set +e
          flutter test test/features/quran/presentation/quran_reader_page_test.dart --plain-name "ayah playback shows active Bangla word meaning as a bubble and keeps translation"
          reader_status=$?
          flutter test test/features/settings/presentation/settings_page_test.dart --plain-name "playback Bangla word meaning has its own toggle"
          settings_status=$?
          if [ "$reader_status" -ne 0 ] || [ "$settings_status" -ne 0 ]; then
            exit 1
          fi
