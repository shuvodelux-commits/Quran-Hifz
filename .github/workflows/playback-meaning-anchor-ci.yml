name: Playback Meaning Anchor CI

on:
  push:
    branches:
      - fix/anchor-playback-word-meaning

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reader regression tests
        run: flutter test --fail-fast test/features/quran/presentation/quran_reader_page_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Full test suite
        run: flutter test --fail-fast
