name: Hifz Pattern CI

on:
  push:
    branches:
      - feat/hifz-pattern-editor-shortcut

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Targeted tests
        run: |
          flutter test --fail-fast test/features/hifz/presentation/hifz_pattern_editor_sheet_test.dart
          flutter test --fail-fast test/features/quran/presentation/quran_surah_list_page_test.dart
