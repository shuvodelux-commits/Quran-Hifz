name: Hifz Reader Modes CI

on:
  push:
    branches:
      - feat/hifz-page-continuous-reader

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Hifz reader regressions
        run: |
          flutter test --fail-fast             test/features/hifz             test/features/quran/presentation/mushaf             test/features/quran/presentation/quran_strict_mushaf_surface_test.dart             test/assets/hifz_mushaf_responsive_css_test.dart             test/assets/mushaf_renderer_asset_test.dart             test/features/settings/domain/app_preferences_test.dart             test/features/settings/application/app_preferences_controller_test.dart             test/features/settings/data/user_database_app_preferences_repository_test.dart

      - name: Normal Quran reader regression
        run: flutter test test/features/quran/presentation/quran_reader_page_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
