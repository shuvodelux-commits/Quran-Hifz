name: Hifz Reader Modes CI

on:
  push:
    branches:
      - feat/hifz-page-continuous-reader

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Task 2 renderer protocol tests
        run: flutter test test/features/quran/presentation/mushaf/mushaf_renderer_message_test.dart test/features/quran/presentation/mushaf/mushaf_webview_driver_test.dart
